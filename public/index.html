<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Niche Research Tool</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>YouTube Niche Research Lab</h1>
    <p>Fast-growing niche finder with category discovery, channel filters, and real-time keyword research.</p>
  </header>

  <main>
    <section class="card">
      <h2>1) Category Explorer</h2>
      <div id="categories" class="chips"></div>
      <p class="muted" id="pickedCategory"></p>
      <div class="grid-2">
        <div>
          <h3>Relevant Channels</h3>
          <div id="categoryChannels"></div>
        </div>
        <div>
          <h3>Trending Videos</h3>
          <div id="categoryVideos"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>2) Channel Finder (Manual Filters)</h2>
      <div class="form-grid">
        <input id="channelKeyword" placeholder="Keyword (e.g. ai automation)" />
        <input id="minSubs" type="number" placeholder="Min Subscribers" value="10000" />
        <input id="maxSubs" type="number" placeholder="Max Subscribers" value="500000" />
        <input id="minVideos" type="number" placeholder="Min Video Count" value="30" />
        <input id="channelPerf" type="number" step="0.1" placeholder="Performance signal" value="1.1" />
        <button id="findChannels">Find Channels</button>
      </div>
      <div id="finderResult"></div>
    </section>

    <section class="card">
      <h2>3) Keyword Trend Scanner (Real-time)</h2>
      <div class="form-grid">
        <input id="keyword" placeholder="Enter keyword" />
        <input id="minViews" type="number" value="10000" placeholder="Min views" />
        <input id="maxAgeMonths" type="number" value="6" placeholder="Max age in months" />
        <input id="perf" type="number" step="0.1" value="1.5" placeholder="Opportunity ratio" />
        <button id="scanKeyword">Scan Keyword</button>
      </div>
      <div id="keywordStats" class="stats"></div>
      <div id="keywordVideos"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
